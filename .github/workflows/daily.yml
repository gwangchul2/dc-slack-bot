name: Run DC Slack Bot Every Hour

on:
  schedule:
    - cron: "0 * * * *" # 매 시간 정각
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to confirm run"
        required: true

concurrency:
  group: dc-slack-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repo
        uses: actions/checkout@v3

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: 📁 Cache bot state (.state/dc_checked.json)
        uses: actions/cache@v3
        with:
          path: .state
          key: dc-bot-cache-${{ runner.os }}
          restore-keys: |
            dc-bot-cache-

      - name: 📥 Install dependencies
        run: npm install

      - name: 🧱 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 🤖 Run Slack bot
        run: node --loader ts-node/esm dc-slack-bot.ts
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
# 깃 올릴때  git add . // git commit -m "내용" // git push origin main
